<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Proxmox CT Control</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Proxmox CT Control</h1>
    <button id="settingsBtn" class="icon-btn" aria-label="Configurações">⚙</button>
  </header>

  <main id="homeView" class="view">
    <div id="cardList" class="card-list"></div>
    <p id="emptyMsg" class="empty-msg hidden">
      Nenhum container configurado. Toque em ⚙ para escolher quais controlar.
    </p>
  </main>

  <main id="settingsView" class="view hidden">
    <h2>Configurações</h2>
    <p class="hint">Selecione os containers que este app deve controlar.</p>

    <div id="checkboxList" class="checkbox-list"></div>

    <button id="saveSettingsBtn" class="btn btn-start">Salvar</button>
    <button id="backBtn" class="btn btn-secondary">Voltar</button>

    <p id="settingsMsg" class="settings-msg"></p>
  </main>

  <template id="cardTemplate">
    <section class="status-card">
      <div class="status-header">
        <span class="ct-label"></span>
        <span class="status-dot status-unknown"></span>
      </div>
      <div class="status-text">—</div>
      <div class="uptime"></div>
      <p class="card-error"></p>
      <div class="actions actions-4">
        <button class="btn btn-start" data-action="start">Start</button>
        <button class="btn btn-stop" data-action="stop">Stop</button>
        <button class="btn btn-restart" data-action="restart">Restart</button>
        <button class="btn btn-shutdown" data-action="shutdown">Shutdown</button>
      </div>
    </section>
  </template>

  <script src="/app.js"></script>
</body>
</html>
